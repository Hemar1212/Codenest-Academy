<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for a Course | CodeNest Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <a class="brand" href="/">CodeNest Academy 🚀</a>
            <nav class="site-nav" aria-label="Main">
                <a href="/">Home</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        <div class="hero">
            <p class="subtitle">Training | Projects | Freshers Guide</p>
            <h1>Register for a course</h1>
            <p>Fill in your details and pick the course you want to join.</p>
        </div>

        <!-- The action and method are added in the Flask step, when the form is connected to MySQL. -->
        <form class="form-card" method="post" action="/register" enctype="multipart/form-data">
            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="field">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="10" max="80" placeholder="Enter your age" required>
            </div>

            <fieldset class="field">
                <legend>Gender</legend>
                <div class="radios">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
            </fieldset>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="field">
                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">Select a course</option>
                    <option value="full-stack">Full Stack Development</option>
                    <option value="java">Java Programming</option>
                    <option value="devops">DevOps</option>
                </select>
            </div>

            <div class="field">
                <label for="resume">Resume</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
                <p class="hint">PDF or Word file.</p>
            </div>

            <div class="actions">
                <button class="button" type="submit">Register now</button>
                <button class="button secondary" type="reset">Clear form</button>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <div class="wrap">
            <a href="/">Home</a>
        </div>
    </footer>
</body>
</html>
